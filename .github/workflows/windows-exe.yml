name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master, desktop/**]
    tags: ["desktop-v*"]
    paths-ignore: ["pictures/**", "data/**", "**/*.md"]
  pull_request:
    paths: ["desktop/**", "frontend/**", "requirements.txt", ".github/workflows/windows-exe.yml"]

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      # Upstream tracks Linux-only runtime filenames containing colons.
      # Disable index rejection, then exclude the entire runtime-data tree.
      - name: Allow sparse index containing upstream Linux paths
        run: git config --global core.protectNTFS false
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $env:GITHUB_WORKSPACE '.venv/Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          .venv/Scripts/python.exe -m pip install -r desktop/requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip check
      - name: Build frontend
        env:
          VITE_DESKTOP: "true"
          VITE_API_BASE_URL: ""
        run: |
          npx --yes pnpm@9.15.9 --dir frontend install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes pnpm@9.15.9 --dir frontend run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Verify source backend
        env:
          JUBEN_PYTHON: python
        run: |
          python desktop/test_windows_checkpoint.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/test_custom_api.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/check_backend.cjs
      - name: Freeze Python backend
        run: python -m PyInstaller --noconfirm --distpath dist/backend --workpath build/backend desktop/backend.spec
      - name: Build desktop application
        working-directory: desktop
        run: npm run pack
      - name: Verify packaged EXE and persistent data
        working-directory: desktop
        env:
          JUBEN_EXE: ${{ github.workspace }}\dist\desktop\win-unpacked\Juben.exe
          JUBEN_SCREENSHOT: ${{ github.workspace }}\dist\desktop\desktop-preview.png
          JUBEN_TEST_CUSTOM: "1"
          JUBEN_SETTINGS_SCREENSHOT: ${{ github.workspace }}\dist\desktop\api-settings-preview.png
        run: npm run smoke
      - name: Build installable EXE
        working-directory: desktop
        run: npm run dist
      - name: Verify installation custom API upgrade and uninstall
        env:
          JUBEN_SCREENSHOT: ${{ github.workspace }}\dist\desktop\desktop-preview.png
          JUBEN_SETTINGS_SCREENSHOT: ${{ github.workspace }}\dist\desktop\api-settings-preview.png
        run: |
          $env:JUBEN_INSTALLER = (Get-ChildItem 'dist/desktop/Juben-Setup-*-Windows-x64.exe' | Select-Object -First 1).FullName
          node desktop/installer-smoke.cjs
      - name: Write checksums
        run: |
          Get-ChildItem dist/desktop/Juben-Setup-*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)"
          } | Set-Content dist/desktop/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Juben-Installer-Windows-x64
          path: |
            dist/desktop/Juben-Setup-*.exe
            dist/desktop/SHA256SUMS.txt
            dist/desktop/desktop-preview.png
            dist/desktop/api-settings-preview.png
          if-no-files-found: error
          retention-days: 30
